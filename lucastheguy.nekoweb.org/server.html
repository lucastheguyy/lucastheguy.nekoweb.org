<!doctype html>
<html>
	<head>
		<title>This is my server yk</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	</head>
	<body>
		<style>
			:root {
			--height: 340px;
			--width: 100%
			}
			.container {
				display: flex;
				justify-content: center;
				flex-wrap: wrap;
			}
			
			.titlebar {
				position: relative;
				border: 2px solid;
				background-color: rgb(59 130 246/0.5);
				background-filter: blur(4px);
				padding: 5px;
				width: var(--width);
				height: var(--height);
			}
			
			.controlbar {
				position: relative;			
				text-align: right;
				font-size: 1.5em;
				bottom: 3px;
			}
			
			.content {
				text-align: center;
				position: absolute;
				top: 32px;
				width: calc(var(--width) - 10px);
				height: calc(var(--height) - 28px);
				border: 2px solid black;
				background-color: #ffffff;
				box-sizing: border-box;

			}
			.thing {
				position: relative;
				bottom: 10px;
				left: 50px;
				color: rgb(209 50 0);
				animation: Stretch 3s cubic-bezier(0.37, 0, 0.63, 1) infinite;
				image-rendering: pixelated
				
			}

			@keyframes Stretch {
				0%,
				100% {
					transform: scale(0.5, 0.5) rotate(-15deg);
				}
				50% {
					transform: scale(0.7, 0.7) rotate(-15deg);
				}
			}
		</style>
		<div class="container">
			<div class="titlebar">
				<div class="controlbar">
					
					<span>-</span> <span>☐</span> <span>X</span>
				</div>
				<div class="content">
					<h1>My Cool FUCKING server</h1>
					<h2 class="thing">i dont care enough to make this look good shut up</h2>
					<h3>Services</h3>
					<a href="https://cpyprty.night.vn.ua">Copyparty</a><br>
					<a href="https://koito.night.vn.ua">Koito</a>
					
					
					
				</div>
			</div>
		</div>
	</body>
</html>
